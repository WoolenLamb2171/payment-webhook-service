[project]
name = "payment-webhook-service"
version = "0.1.0"
description = "Payment webhook processing service built with FastAPI and PostgreSQL"
readme = "README.md"
authors = [
    { name = "WoolenLamb2171", email = "romanmurtukov@gmail.com" }
]
requires-python = ">=3.12,<3.13"

dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]